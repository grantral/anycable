name: Publish Docker images
on:
  workflow_dispatch:
  push:
    branches:
      - add-tls-support
      - add-tls-support-169

jobs:
  push_to_ghcr:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      GO111MODULE: on
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install bison
      - run: go mod vendor
      - uses: ruby/setup-ruby@v1
        with:
          # Use <3.0 since go-mruby's Rakefile has some problems with keyword arguments compatibility
          ruby-version: 2.7
          bundler-cache: true
      - name: Build mruby
        run: bash -c '(cd vendor/github.com/mitchellh/go-mruby && MRUBY_CONFIG=../../../../../../etc/build_config.rb make libmruby.a)'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set VERSION (if any)
        if: ${{ contains(github.ref, 'refs/tags/v') }}
        id: version
        run: |
          echo VERSION=${GITHUB_REF#refs/tags/v} >> $GITHUB_OUTPUT
      - name: Prepare files for Docker build
        run: |
          cp /etc/ssl/certs/ca-certificates.crt ./.docker/ca-certificates.crt
      - name: Build binary
        run: |
          env GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o .docker/linux/amd64/anycable-go cmd/anycable-go/main.go
          .docker/linux/amd64/anycable-go -v
      - uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Docker metadata and versions
        id: meta
        uses: docker/metadata-action@v4
        with:
          flavor: |
            latest=false
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
      - name: Build and push alpine images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile.alpine
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
